<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo-light-glass.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/logo-dark-glass.svg" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/logo-light-glass.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The page renders from JavaScript, so without these the fonts would only be requested after it runs. -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>Lazaro Dev</title>
    <meta name="description" content="Lazaro Toconas, remote full stack developer based in Bolivia. Six years building applications end to end, from the database up to the interface." />

    <!-- Link previews (LinkedIn, WhatsApp, Slack, X). Image URLs must be absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lazarus-99.github.io/portfolio/" />
    <meta property="og:title" content="Lazaro Toconas · Full Stack Developer" />
    <meta property="og:description" content="Six years building applications end to end, from the database up to the interface." />
    <meta property="og:image" content="https://lazarus-99.github.io/portfolio/og-image-2.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Lazaro Toconas, Full Stack Developer: From idea to web app." />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="es_ES" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Applies the saved theme before anything paints, so the loader (and the page) never flash
         the wrong colors. Same logic as ThemeProvider. -->
    <script>
      (function () {
        var theme;
        try { theme = localStorage.getItem('theme'); } catch (e) {}
        if (!theme) theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
        // Lets scroll-reveal elements start hidden without a flash of visible content.
        document.documentElement.classList.add('reveal-ready');
      })();
    </script>
    <!-- Loader styles live here, not in the app's CSS, so they apply before anything else loads. -->
    <style>
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 22px;
        background: #0a0a0f;
        transition: opacity 0.4s ease, visibility 0s linear 0.4s;
      }
      [data-theme='light'] #app-loader { background: #f7f7fa; }
      #app-loader.is-done { opacity: 0; visibility: hidden; }
      #app-loader img { width: 56px; height: 56px; animation: loader-pulse 1.4s ease-in-out infinite; }
      [data-theme='light'] #app-loader .loader-dark,
      [data-theme='dark'] #app-loader .loader-light { display: none; }
      #app-loader .loader-bar {
        position: relative;
        width: 120px;
        height: 3px;
        overflow: hidden;
        border-radius: 3px;
        background: rgba(127, 127, 140, 0.2);
      }
      #app-loader .loader-bar::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: inherit;
        background: linear-gradient(90deg, #6d28d9, #0891b2);
        animation: loader-slide 1.1s ease-in-out infinite;
      }
      @keyframes loader-pulse { 50% { transform: scale(0.92); opacity: 0.7; } }
      @keyframes loader-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) {
        #app-loader img, #app-loader .loader-bar::after { animation: none; }
        #app-loader .loader-bar::after { width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="app-loader" role="status" aria-label="Loading">
      <img class="loader-dark" src="/logo-dark-glass.svg" alt="" />
      <img class="loader-light" src="/logo-light-glass.svg" alt="" />
      <div class="loader-bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
